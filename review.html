<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — MS Auto &amp; Smog</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .card { max-width: 480px; margin: 1.2rem auto; background: #f4efd8; border: 6px solid #1b5a38; padding: 1.2rem; }
    .card .shop-kicker { color: #1b5a38; letter-spacing: .12em; }
    .card img { width: 220px; height: 220px; display: block; margin: 0.7rem auto; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button, .actions a { background: #241f1a; color: #f4efd8; border: 0; padding: 0.5rem 0.7rem; text-decoration: none; font-family: Teko, sans-serif; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; font-size: 1.05rem; }
    @media print { .steel, .actions, .lang { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <header class="steel">
    <span>MS Auto &amp; Smog</span>
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
  </header>
  <article class="card">
    <h1 class="shop-kicker">MS AUTO &amp; SMOG</h1>
    <p>1415 S Santa Fe Ave., Vista, CA 92083</p>
    <p><a class="plain" href="tel:+17605363202">(760) 536-3202</a></p>
    <img src="review-qr.svg" width="220" height="220" alt="QR code to find MS Auto &amp; Smog on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the bay" data-es="Volver al taller">Back to the bay</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
